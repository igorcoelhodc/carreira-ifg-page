<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Carreira | IFG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
       DESIGN SYSTEM: NEO-BRUTALISMO ACADÊMICO (IFG SISTEMAS DE INFORMAÇÃO)
       ========================================================================= */
    :root {
      --bg-page: #F4EFEB;
      --card-bg: #FFFFFF;
      --ink-black: #000000;
      --accent-mustard: #DCA855;
      --accent-blue: #8ECAE6;
      --accent-lilac: #D8B4E2;
      --accent-mint: #B7E4C7;
      --accent-coral: #FFB5A7;
      --disabled-bg: #E5E5E5;
      --disabled-text: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--ink-black);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 3px solid var(--ink-black);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .top-strip {
      background: var(--ink-black);
      color: #fff;
      padding: 6px 16px;
      font-size: 11px;
      font-family: monospace;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      letter-spacing: 0.05em;
    }

    .navbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: var(--accent-mustard);
      border: 2px solid var(--ink-black);
      font-family: 'Archivo Black', sans-serif;
      font-size: 18px;
      padding: 6px 10px;
      box-shadow: 2px 2px 0px var(--ink-black);
    }

    .brand-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 18px;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .hero-container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 20px;
    }

    .hero-card {
      background: #fff;
      border: 3px solid var(--ink-black);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 4px 4px 0px var(--ink-black);
      margin-bottom: 24px;
    }

    .hero-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(28px, 4vw, 44px);
      text-transform: uppercase;
      line-height: 1.1;
      margin: 8px 0 12px;
    }

    /* GRID RESPONSIVO MOBILE-FIRST */
    #grid-eventos {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 48px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 768px) {
      #grid-eventos {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      #grid-eventos {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* CARD NEO-BRUTALISTA DE PALESTRA */
    .lecture-card {
      background-color: var(--card-bg);
      border: 2px solid var(--ink-black);
      border-radius: 12px;
      box-shadow: 4px 4px 0px var(--ink-black);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .lecture-card:hover {
      transform: translateY(-2px);
      box-shadow: 6px 6px 0px var(--ink-black);
    }

    .card-photo-wrapper {
      position: relative;
      width: 100%;
      height: 220px;
      background-color: #111;
      border-bottom: 2px solid var(--ink-black);
      overflow: hidden;
    }

    .card-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-tags {
      position: absolute;
      bottom: 10px;
      left: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      z-index: 10;
    }

    .tag-badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      border: 1.5px solid var(--ink-black);
      border-radius: 6px;
      background: var(--accent-mustard);
      color: #000;
      box-shadow: 1px 1px 0px var(--ink-black);
    }

    .card-number {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--ink-black);
      color: #fff;
      font-family: monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.4);
    }

    .card-info-section {
      padding: 16px;
      border-bottom: 2px solid var(--ink-black);
    }

    .card-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 16px;
      text-transform: uppercase;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .card-speaker {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: #333;
    }

    /* GRADE TABULAR INTERNA ESTILO TICKET DE CONCERTO */
    .ticket-table {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-bottom: 2px solid var(--ink-black);
      background: var(--bg-page);
      text-align: center;
    }

    .ticket-col {
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .ticket-col:not(:last-child) {
      border-right: 2px solid var(--ink-black);
    }

    .ticket-label {
      font-size: 9px;
      font-family: monospace;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
    }

    .ticket-value {
      font-family: 'Archivo Black', sans-serif;
      font-size: 14px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* BOTÕES DA BASE E REGRA DE LINKS */
    .card-actions {
      padding: 14px;
      background: var(--bg-page);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      text-decoration: none;
      border: 2px solid var(--ink-black);
      border-radius: 6px;
      box-shadow: 2px 2px 0px var(--ink-black);
      cursor: pointer;
      transition: all 0.1s;
    }

    .btn-primary {
      background: var(--ink-black);
      color: #fff;
    }

    .btn-primary:hover {
      background: #222;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--ink-black);
    }

    .btn-secondary {
      background: #fff;
      color: var(--ink-black);
    }

    .btn-secondary:hover {
      background: #f0f0f0;
      transform: translate(-1px, -1px);
    }

    /* REGRA MANDATÓRIA DE LINKS VAZIOS: .btn-disabled */
    .btn-disabled,
    button[disabled],
    a[disabled] {
      cursor: not-allowed !important;
      opacity: 0.55 !important;
      pointer-events: none !important;
      background-color: var(--disabled-bg) !important;
      color: var(--disabled-text) !important;
      border-color: var(--ink-black) !important;
      background-image: repeating-linear-gradient(
        -45deg,
        #e5e5e5,
        #e5e5e5 6px,
        #dcdcdc 6px,
        #dcdcdc 12px
      ) !important;
      box-shadow: 1px 1px 0px var(--ink-black) !important;
      transform: none !important;
      text-decoration: line-through;
    }
  </style>
</head>
<body>

    <div class="navbar-inner">

  </header>

  <div class="hero-container">
    <div class="hero-card">
      <div style="font-family: monospace; font-size: 11px; font-weight: bold; background: var(--accent-mustard); display: inline-block; padding: 2px 8px; border: 1.5px solid #000; border-radius: 4px;">
        AGENDA OFICIAL

  <!-- CONTAINER PRINCIPAL DOS CARDS -->
  <main id="grid-eventos"></main>

    // FUNÇÃO PRINCIPAL DE RENDERIZAÇÃO
    function renderApp() {
      // 1. Atualizar Metadados
      const meta = siteData.site_metadata || {};
      if (meta.titulo_pagina) {
        document.title = meta.titulo_pagina;
        const pageTitleEl = document.getElementById('page-title');
        if (pageTitleEl) pageTitleEl.textContent = meta.titulo_pagina;
      }
      if (meta.hero_titulo) {
        const heroTitleEl = document.getElementById('hero-title');
        if (heroTitleEl) heroTitleEl.textContent = meta.hero_titulo;
      }

      // 2. Renderizar Grade de Eventos
      const grid = document.getElementById('grid-eventos');
      if (!grid) return;
      grid.innerHTML = '';

      const palestras = siteData.palestras || [];
      palestras.forEach((palestra) => {
        const card = document.createElement('article');
        card.className = 'lecture-card';

        // Tags badges
        const tagsHtml = (palestra.tags || [])
          .map(tag => `<span class="tag-badge">${tag.toUpperCase()}</span>`)
          .join('');

        // Validação da Regra de Links (Inscrição)
        const inscricaoUrl = (palestra.links && palestra.links.inscricao) ? palestra.links.inscricao.trim() : '';
        const isInscricaoEmpty = inscricaoUrl === '';
        const inscricaoBtn = isInscricaoEmpty
          ? `<button disabled class="btn btn-primary btn-disabled" title="Inscrição encerrada">Inscrição</button>`
          : `<a href="${inscricaoUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">Inscrição</a>`;

        // Validação da Regra de Links (Material)
        const materialUrl = (palestra.links && palestra.links.material) ? palestra.links.material.trim() : '';
        const isMaterialEmpty = materialUrl === '';
        const materialBtn = isMaterialEmpty
          ? `<button disabled class="btn btn-secondary btn-disabled" title="Sem material">Material</button>`
          : `<a href="${materialUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">Material</a>`;

        // Estrutura HTML do Card
        card.innerHTML = `
          <div class="card-photo-wrapper">
            <img class="card-photo" src="${palestra.palestrante.foto_url}" alt="${palestra.palestrante.nome}" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80'" />
            <div class="card-number">№ ${palestra.id}</div>
            <div class="card-tags">${tagsHtml}</div>
          </div>

          <div class="card-info-section">
            <h3 class="card-title">${palestra.titulo}</h3>
            <div class="card-speaker">${palestra.palestrante.nome}</div>
          </div>

          <div class="ticket-table">
            <div class="ticket-col">
              <span class="ticket-label">Data</span>
              <span class="ticket-value">${palestra.data}</span>
            </div>
            <div class="ticket-col" style="background:#fff;">
              <span class="ticket-label">Dia</span>
              <span class="ticket-value">${palestra.dia_semana}</span>
            </div>
            <div class="ticket-col">
              <span class="ticket-label">Horário</span>
              <span class="ticket-value">${palestra.horario}</span>
            </div>
          </div>

          <div class="card-actions">
            ${inscricaoBtn}
            ${materialBtn}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Inicialização ao carregar a página
    document.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
